const bmi=(w,h)=>w/((h/100)**2),cat=b=>b<18.5?'bajo':b<25?'saludable':b<30?'sobrepeso':'alto';
const maxRate=w=>Math.max(.1,Math.floor(Math.min(1,w*.01)*10)/10);
function calc(p){const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='f'?-161:p.sex=='m'?5:-78),td=bmr*[1.2,1.375,1.55,1.725][p.act];let k=td+(p.goal=='lose'?-1:p.goal=='gain'?1:0)*p.rate*1100;const fl={f:1200,m:1500,n:1350}[p.sex],cl=k<fl;k=r0(Math.max(k,fl));const pr=r0(p.w*1.6),fa=r0(k*.27/9);return{kcal:k,p:pr,c:Math.max(0,r0((k-pr*4-fa*9)/4)),f:fa,clamped:cl}}
function tgt(d){const T=S.t.kcal;if(S.p.split!='wk')return T;const wd=r0(T*.9),g=at(d).getDay();return g==0||g==6?r0((T*7-wd*5)/2):wd}
const sum=a=>a.reduce((t,i)=>({k:t.k+i.k,p:t.p+i.p,c:t.c+i.c,f:t.f+i.f}),{k:0,p:0,c:0,f:0});
const meals=n=>n==1?['Comida']:n==2?['Desayuno','Cena']:['Desayuno','Almuerzo','Cena',...Array.from({length:n-3},(_,i)=>'Merienda '+(i+1))];
const MEM=n=>n.startsWith('Desayuno')?'🌅':n=='Almuerzo'?'☀️':n=='Cena'?'🌙':n.startsWith('Merienda')?'🍎':'🍽️';
const MCOL=['var(--pt)','var(--pm)','var(--pg)','var(--pp)','var(--pl)','var(--ps)'];
const dayL=d=>S.log[d]||(S.log[d]={items:[],water:0});
const defMeal=n=>{const h=new Date().getHours();return Math.min(n==1?0:n==2?(h<15?0:1):h<11?0:h<16?1:2,n-1)};

<path d="M100 20C152 20 180 62 180 114C180 162 148 186 100 186C52 186 20 162 20 114C20 62 48 20 100 20Z" fill="#6EE7B7" stroke="${o}" stroke-width=5 stroke-linejoin=round />

<ellipse cx=58 cy=60 rx=15 ry=8 transform="rotate(-38 58 60)" fill="#fff" opacity=.5 />

${eyes}${mouth}
<clipPath id=${id}><ellipse cx=100 cy=146 rx=38 ry=28 /></clipPath><ellipse cx=100 cy=146 rx=38 ry=28 fill="#FFF8EA" />
<g clip-path="url(#${id})"><path class=tw d="M40 ${y}q10 -7 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0V190H40Z" fill="${fc}"/></g>
<ellipse cx=100 cy=146 rx=38 ry=28 fill=none stroke="${o}" stroke-width=4.5 /></svg>`}
function confetti(){const c=document.createElement('div');c.className='cf';const cl=['#FF8FB8','#FFDE59','#6EE7B7','#7CC8FF','#9B7BFF','#FFA94D'];for(let i=0;i<48;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:${cl[i%6]};--dx:${(Math.random()-.5)*180}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.35}s;border-radius:${i%3?'3px':'50%'}`;c.appendChild(s)}document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}
function countUp(el){const v=+el.dataset.v,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=r0(v*e);if(k<1)requestAnimationFrame(f)})(t0)}

/* ---------- Entrada ---------- */
const loginView=()=>`<div class=lg>${mascot('happy',.35,false,190,true)}<h1>Munchi</h1><p>Tu compañero para comer rico y llevar la cuenta sin estrés.</p></div><div class=card><input id=em class=in type=email placeholder="tu@correo.com" style="margin-top:0"><button class=btn style="width:100%;margin:6px 0 0" data-a=mail>Enviar enlace al correo ✉️</button><p class=note id=lm style="min-height:0;margin:10px 0 0"></p></div><button class="btn alt" data-a=google>Continuar con Google</button><button class="btn ghost" data-a=skip>Usar sin cuenta</button>`;

/* ---------- Onboarding ---------- */
const OC=['var(--pt)','var(--pm)','var(--pg)','var(--pp)'];
const opts=(k,l)=>l.map(([v,t,e,d],i)=>`<div class="opt ${ob[k]==v?'on':''}" data-a=o data-k=${k} data-v=${v}><span class=em style="background:${OC[i%4]}">${e}</span><div><b>${t}</b>${d?`<small>${d}</small>`:''}</div><i class=ck>✓</i></div>`).join('');
const num=(k,min,max,step,u)=>`<div class=big><b id=v>${ob[k]}</b> ${u}</div><div class=ns><button data-a=nm aria-label="Menos">−</button><button data-a=np aria-label="Más">+</button></div><input type=range data-k=${k} min=${min} max=${max} step=${step} value=${ob[k]}><div class=note id=nt>${nt(k)}</div>`;
function wdate(){const w=Math.abs(ob.w-ob.tw)/ob.rate;return new Date(Date.now()+w*7*DAY).toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}
function nt(k){if(k=='w')return `IMC ${bmi(ob.w,ob.h).toFixed(1)}: ${cat(bmi(ob.w,ob.h))}`;if(k=='tw')return `IMC de tu meta: ${bmi(ob.tw,ob.h).toFixed(1)} (${cat(bmi(ob.tw,ob.h))}). Mínimo sugerido por salud: IMC 18,5.`;if(k=='rate')return `${ob.rate<.3?'Lento':ob.rate<.6?'Óptimo':'Rápido'}: llegarías a tu meta el ${wdate()}.`;return ''}
function keys(){return ['goal','sex','age','act','h','w',...(ob.goal!='keep'?['tw','rate']:[]),'meals','split','sum']}
function fit(){const m=Math.ceil(18.5*(ob.h/100)**2);if(ob.goal=='lose'){ob.tw=Math.min(Math.max(ob.tw,m),Math.max(m,ob.w-.5))}if(ob.goal=='gain')ob.tw=Math.max(ob.tw,ob.w+.5);ob.rate=Math.min(ob.rate,maxRate(ob.w))}
function step(k){
 const Q={
 goal:['¡Hola! Soy Munchi 👋 ¿Cuál es tu objetivo?',()=>opts('goal',[['lose','Bajar de peso','📉'],['keep','Mantener peso','⚖️'],['gain','Subir de peso','💪']])],
 sex:['¿Cómo te identificas?',()=>opts('sex',[['f','Femenino','👩'],['m','Masculino','👨'],['n','No binario','✨']])],
 age:['¿Cuántos años tienes?',()=>num('age',18,80,1,'años')],
 act:['¿Qué tan activa/o eres?',()=>opts('act',[[0,'Poco activa','🛋️','Me falta el aire al subir escaleras'],[1,'Ligeramente activa','🚶','A veces hago ejercicio corto'],[2,'Moderadamente activa','🏃','Hago ejercicio 1 o 2 veces por semana'],[3,'Muy activa','🏋️','El ejercicio es parte de mi vida']])],
 h:['¿Cuánto mides?',()=>num('h',120,210,1,'cm')],
 w:['¿Cuánto pesas hoy?',()=>num('w',30,200,.5,'kg')],

 rate:['¿Con qué ritmo vamos?',()=>{fit();return num('rate',.1,maxRate(ob.w),.1,'kg por semana')}],

 sum:['¡Tu plan está listo! 🎉',()=>{const c=calc(ob);return `<div class=card style="text-align:center"><div class=big style="margin:6px 0"><b id=cu data-v=${c.kcal}>0</b><br>kcal al día</div><div class="tiles t3" style="margin-top:12px"><div class=tl style="--c:var(--pp)"><b>${c.p} g</b><small>Proteína</small></div><div class=tl style="--c:var(--pl)"><b>${c.c} g</b><small>Carbos</small></div><div class=tl style="--c:var(--ps)"><b>${c.f} g</b><small>Grasas</small></div></div></div><p class=note>${c.clamped?'Ajustamos tu meta al mínimo diario recomendado. ':''}Es una estimación general y no reemplaza el consejo de un profesional de la salud.</p>`}]};
 return Q[k]}
function obView(){const ks=keys(),k=ks[oi],[q,f]=step(k),mood=k=='sum'?'full':k=='goal'?'happy':oi%3==2?'yum':'happy';
 return `<div class=top>${oi?'<button class=back2 data-a=back aria-label="Atrás">‹</button>':'<i></i>'}<div class=track><i style="width:${(oi+1)/ks.length*100}%"></i></div><small>${oi+1}/${ks.length}</small></div><div class=say>${mascot(mood,k=='sum'?1:(oi+1)/ks.length,false,104,k=='goal')}<div class=bub>${q}</div></div>${f()}<button class=btn data-a=next>${k=='sum'?'¡Vamos! 🚀':'Continuar'}</button>`}
function finish(){fit();S.p={...ob};S.t=calc(S.p);const l=S.wt[S.wt.length-1];if(!l||l.w!=ob.w)S.wt.push({d:today,w:ob.w});ob=null;tab='plan';save()}

/* ---------- Plan ---------- */
function streak(){let n=0,d=new Date();const has=x=>((S.log[dk(x)]||{}).items||[]).length>0;if(!has(d))d=new Date(Date.now()-DAY);while(has(d)){n++;d=new Date(d.getTime()-DAY)}return n}
function best(){const ds=Object.keys(S.log).filter(d=>S.log[d].items.length).sort();let b=0,c=0,pr=null;for(const d of ds){c=pr&&r0((at(d)-at(pr))/DAY)==1?c+1:1;b=Math.max(b,c);pr=d}return b}
function weekStrip(){const g=(at(sel).getDay()+6)%7,st=at(sel).getTime()-g*DAY;return `<div class=wk><button class=ar data-a=wk data-n=-1>‹</button>${[...Array(7)].map((_,i)=>{const d=dk(new Date(st+i*DAY));return `<div class="d ${d==sel?'on':''} ${d==today?'t':''}" data-a=day data-d=${d}><small>${'LMMJVSD'[i]}</small><b>${at(d).getDate()}</b></div>`}).join('')}<button class=ar data-a=wk data-n=1>›</button></div>`}
function home(){const L=dayL(sel),T=sum(L.items),tk=tgt(sel),r=tk/S.t.kcal,p=T.k/tk,over=T.k>tk,st=streak(),ms=meals(S.p.meals),wg=r0(S.p.w*35/250)*250,n=L.items.length;
 let mood='happy',msg;
 if(Date.now()<yumUntil){mood='yum';msg='¡Ñam ñam! Qué rico 😋'}
 else if(!n){mood='yum';msg=sel==today?(new Date().getHours()<11?'¡Buen día! ¿Qué desayunamos hoy?':'Tengo hambre… ¡cuéntame qué comiste!'):'Este día está vacío. ¿Quieres anotar algo?'}
 else if(over){mood='oops';msg='Uy, nos pasamos un poquito. ¡Mañana lo equilibramos!'}
 else if(p>=.9){mood='full';msg='¡Pancita llena! Meta del día cumplida 🎯'}
 else if(p>=.5){msg='Ya casi llenamos la pancita. ¡Vas genial!'}
 else msg='¡Buen comienzo! Sigue así 💪';
 const mc=[['Proteína',T.p,S.t.p*r,'var(--pink)'],['Carbos',T.c,S.t.c*r,'var(--lem)'],['Grasas',T.f,S.t.f*r,'var(--sky)']],wd=at(sel).toLocaleDateString('es',{weekday:'long'}),dt=at(sel).toLocaleDateString('es',{day:'numeric',month:'long'});
 return `<div class=hd><div><h1>${sel==today?'Hoy':cap(wd)}</h1><small>${sel==today?cap(wd)+', ':''}${dt}</small></div><div class=streak>${st?'🔥 '+st:'🌱 Día 1'}</div></div>${weekStrip()}`
 +`<div class="card hero ${over?'over':''}"><div class=bub>${msg}</div><div class=hrow><div class=mw>${mascot(mood,p,over,150)}</div><div class=hs><small>${over?'de más':'por comer'}</small><b class=hn>${over?'+'+r0(T.k-tk):r0(tk-T.k)}</b><small>${r0(T.k)} / ${tk} kcal</small></div></div><div class=mac>${mc.map(([nm,v,g,c])=>`<div><div class=ml><span>${nm}</span><b>${r0(v)}/${r0(g)}g</b></div><div class=mb style="--c:${c};--w:${Math.min(100,v/g*100)}%"><i style="--w:${Math.min(100,v/g*100)}%"></i></div></div>`).join('')}</div></div>`
 +ms.map((nm,mi)=>{const its=L.items.map((x,i)=>[x,i]).filter(([x])=>Math.min(x.m,ms.length-1)==mi),mk=sum(its.map(a=>a[0]));
  return `<div class=card><div class=mc><span class=tile style="background:${MCOL[mi%6]}">${MEM(nm)}</span><div style="flex:1"><h2>${nm}</h2><small>${r0(mk.k)} kcal · P ${r0(mk.p)} · C ${r0(mk.c)} · G ${r0(mk.f)}</small></div></div>${its.length?its.map(([x,i])=>`<div class=it><div>${esc(x.n)}<small>${esc(x.s||'')}${x.q&&x.q!=1?' × '+x.q:''}</small></div><div class=row><span class=pill>${x.k}</span><span class=x data-a=del data-i=${i}>✕</span></div></div>`).join(''):'<p class=empty>Nada por aquí todavía.</p>'}<button class=add data-a=add data-i=${mi}>+ Agregar a ${nm.toLowerCase()}</button></div>`}).join('')
 +`<div class=card><div class=row><div><b style="font-size:19px">💧 Agua</b><small style="display:block">${L.water} de ${wg} ml</small></div><button class="sm g" data-a=wdn aria-label="Quitar vaso">−</button></div><div class=drops>${[...Array(Math.min(14,Math.max(1,wg/250)))].map((_,i)=>`<button class="dr ${L.water>=(i+1)*250?'on':''}" data-a=wdrop data-i=${i} aria-label="Vaso ${i+1}">💧</button>`).join('')}</div></div>`}

/* ---------- Progreso ---------- */
function prog(){const last=[...Array(7)].map((_,i)=>{const d=dk(new Date(Date.now()-(6-i)*DAY));return[d,sum((S.log[d]||{items:[]}).items).k]}),mx=Math.max(...last.map(x=>x[1]),S.t.kcal),lg=last.filter(x=>x[1]>0),avg=lg.length?r0(lg.reduce((a,x)=>a+x[1],0)/lg.length):0;
 const w=S.wt.slice(-30),ws=w.map(x=>x.w),tw=S.p.goal!='keep'?S.p.tw:null,lo=Math.min(...ws,...(tw?[tw]:[]))-1,hi=Math.max(...ws,...(tw?[tw]:[]))+1,Y=v=>10+(hi-v)/(hi-lo)*100,X=i=>w.length>1?12+i*276/(w.length-1):150,pts=w.map((x,i)=>[X(i),Y(x.w)]),line=pts.map(p=>p.join(',')).join(' ');
 const d0=w.length?r1(w[w.length-1].w-w[0].w):0;
 return `<div class=hd><div><h1>Progreso</h1><small>Tu camino, paso a paso</small></div></div><div class=st3><div class=tl style="--c:var(--pl)"><b>${streak()}</b><small>🔥 racha</small></div><div class=tl style="--c:var(--pp)"><b>${avg}</b><small>kcal prom.</small></div><div class=tl style="--c:var(--pm)"><b>${Object.keys(S.log).filter(d=>S.log[d].items.length).length}</b><small>días anotados</small></div></div>`
 +`<div class=card><div class=row><b style="font-size:19px">⚖️ Peso</b>${w.length?`<span class=pill>${w[w.length-1].w} kg</span>`:''}</div>${w.length?`<svg class=chart viewBox="0 0 300 130" style="margin-top:10px"><defs><linearGradient id=ag x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#7C5CFF" stop-opacity=.35 /><stop offset=1 stop-color="#7C5CFF" stop-opacity=0 /></linearGradient></defs>${tw?`<line x1=0 x2=300 y1=${Y(tw)} y2=${Y(tw)} stroke="#FF8FB8" stroke-width=2.5 stroke-dasharray="6 5" /><text x=298 y=${Y(tw)-5} text-anchor=end font-size=10 font-weight=800 fill="var(--mut)">meta ${tw} kg</text>`:''}${w.length>1?`<polygon points="${line} ${X(w.length-1)},120 ${X(0)},120" fill="url(#ag)"/><polyline fill=none stroke="var(--ol)" stroke-width=7 stroke-linejoin=round stroke-linecap=round points="${line}"/><polyline fill=none stroke="#7C5CFF" stroke-width=3.5 stroke-linejoin=round stroke-linecap=round points="${line}"/>`:''}${pts.map((p,i)=>`<circle cx=${p[0]} cy=${p[1]} r=${i==pts.length-1?7:4.5} fill="${i==pts.length-1?'#FFDE59':'#7C5CFF'}" stroke="var(--ol)" stroke-width=2.5 />`).join('')}</svg><small>${w.length>1?(d0==0?'Sin cambios desde tu primer registro':(d0<0?'Bajaste ':'Subiste ')+Math.abs(d0)+' kg desde que empezaste'):'Guarda más pesajes para ver tu tendencia.'}</small>`:'<p class=empty>Guarda tu peso para ver la tendencia.</p>'}<div class=wrow><input id=wi class=in type=number step=.1 placeholder="Peso de hoy (kg)" inputmode=decimal><button class=sm data-a=wsave>Guardar</button></div></div>`
 +`<div class=card><b style="font-size:19px">🍽️ Últimos 7 días</b><div class=bars><span class=gl style="bottom:calc(${S.t.kcal/mx*100}% * .82 + 22px)"></span>${last.map(([d,k],i)=>`<div><span>${k?r0(k):''}</span><i style="height:${k/mx*82}%;background:${k>tgt(d)?'var(--tan)':['var(--gra)','var(--pink)','var(--mint)','var(--sky)','var(--lem)','var(--gra)','var(--pink)'][i]}"></i>${'DLMMJVS'[at(d).getDay()]}</div>`).join('')}</div><small>La línea rosa es tu meta diaria.</small></div>`}

/* ---------- Logros ---------- */
function logros(){const ds=Object.keys(S.log).filter(d=>S.log[d].items.length),its=ds.flatMap(d=>S.log[d].items),b=best(),wg=r0(S.p.w*35/250)*250,
 B=[['🍽️','Primer bocado','Anota tu primera comida',its.length>=1,'--pl'],['🔥','Racha de 3','3 días seguidos',b>=3,'--pp'],['🌈','Racha de 7','7 días seguidos',b>=7,'--pg'],['💧','Hidratada/o','Llega a tu meta de agua',Object.keys(S.log).some(d=>S.log[d].water>=wg),'--ps'],['🎯','En la meta','Cierra un día entre 90% y 105%',ds.some(d=>{const k=sum(S.log[d].items).k,t=tgt(d);return k>=t*.9&&k<=t*1.05}),'--pm'],['⚖️','Pesaje','Registra 2 pesajes',S.wt.length>=2,'--pt'],['✨','Amigo de la IA','Estima algo con IA',its.some(i=>/IA/.test(i.s||'')),'--pg'],['🥗','Variado','10 alimentos distintos',new Set(its.map(i=>i.n)).size>=10,'--pm'],['🌟','Constante','14 días anotados',ds.length>=14,'--pl']],
 un=B.filter(x=>x[3]).length,lv=1+Math.floor(ds.length/5),NM=['Semillita','Brote','Retoño','Arbolito','Frutal','Árbol mágico'];

/* ---------- Perfil ---------- */
function perfil(){const t=S.t,p=S.p,b=bmi(p.w,p.h);
 return `<div class=hd><div><h1>Perfil</h1><small>${sb&&U?esc(U.email||''):'Sin cuenta: tus datos viven solo en este dispositivo'}</small></div></div><div class=card style="text-align:center">${mascot('happy',.4,false,120)}<small style="display:block;margin-top:8px">Tu meta diaria</small><div class=big style="margin:0 0 8px"><b style="font-size:60px">${t.kcal}</b> kcal</div><div class="tiles t3"><div class=tl style="--c:var(--pp)"><b>${t.p} g</b><small>Proteína</small></div><div class=tl style="--c:var(--pl)"><b>${t.c} g</b><small>Carbos</small></div><div class=tl style="--c:var(--ps)"><b>${t.f} g</b><small>Grasas</small></div></div></div>`
 +`<div class=card><div class=kv><span>Peso / altura</span><b>${p.w} kg · ${p.h} cm</b></div><div class=kv><span>IMC</span><b>${b.toFixed(1)} (${cat(b)})</b></div><div class=kv><span>Objetivo</span><b>${{lose:'Bajar',keep:'Mantener',gain:'Subir'}[p.goal]}${p.goal!='keep'?' a '+p.tw+' kg':''}</b></div><div class=kv><span>Comidas al día</span><b>${p.meals}</b></div></div>`
 +`<div class=card><b style="font-size:18px">🎨 Apariencia</b><div class=thm>${[['auto','Auto'],['light','☀️ Claro'],['dark','🌙 Oscuro']].map(([v,n])=>`<button class="chip ${TH==v?'on':''}" data-a=theme data-v=${v}>${n}</button>`).join('')}</div></div>`
 +`<button class="btn alt" data-a=redo>Cambiar mis datos</button>${sb&&U?`<button class="btn ghost" data-a=out>Cerrar sesión</button>`:''}${sb&&!U?`<button class="btn ghost" data-a=login>Iniciar sesión</button>`:''}<button class="btn ghost" data-a=reset>${rs?'¿Seguro? Toca otra vez para borrar todo':'Borrar todos los datos'}</button>`}

/* ---------- Agregar comida ---------- */
function flist(){const q=(md.q||'').toLowerCase();return FOODS.map((f,i)=>[f,i]).filter(([f])=>f[0].toLowerCase().includes(q)).map(([f,i])=>`<div class=fi data-a=pick data-i=${i}><span>${f[0]}<small>${f[1]}</small></span><span class=pill>${f[2]}</span></div>`).join('')||'<p class=note>Sin resultados. Prueba con la IA ✨ o agrégalo manualmente.</p>'}
const AI=()=>!!(CF.WORKER_URL&&U);
const tiles=(k,p,c,f)=>`<div class=tiles><div class=tl style="--c:var(--pl)"><b>${k}</b><small>kcal</small></div><div class=tl style="--c:var(--pp)"><b>${p}</b><small>Prot</small></div><div class=tl style="--c:var(--pt)"><b>${c}</b><small>Carbos</small></div><div class=tl style="--c:var(--ps)"><b>${f}</b><small>Grasas</small></div></div>`;
function resView(){const r=md.res;return `<div class=chew style="margin-top:8px">${mascot('full',.8,false,96)}</div><small>Munchi estima:</small><input id=rn class=in value="${esc(r.n)}" style="margin-top:4px">${tiles(r.k,r.p,r.c,r.f)}<button class="btn alt" data-a=rok>Agregar a mi día</button><button class="btn ghost" data-a=rno style="width:100%;margin:4px 0 0">Probar otra vez</button>`}
const busyView=()=>`<div class=chew style="padding:18px 0">${mascot('yum',.6,false,120)}<p class=f1 style="font-size:19px;margin:8px 0 0">Munchi está masticando…</p><small>Calculando calorías y macros</small></div>`;
const needAI=()=>`<div class=chew style="padding:14px 0">${mascot('oops',0,false,96)}<p class=f1 style="font-size:18px;margin:8px 0">${sb?'Inicia sesión para usar la IA':'La IA necesita una cuenta'}</p>${sb?'<button class=sm data-a=login>Iniciar sesión</button>':''}</div>`;
function modal(){if(!md)return '';const ms=meals(S.p.meals);let h;
 const head=`<div class=grab></div><div class=row><b class=mt>Agregar comida</b><span class=x data-a=x>✕</span></div><div class=chips>${ms.map((n,i)=>`<button class="chip ${md.m==i?'on':''}" data-a=mm data-i=${i}>${MEM(n)} ${n}</button>`).join('')}</div>`;
 if(md.pick!=null){const f=FOODS[md.pick],q=md.qty;h=`<button class=back data-a=bk>‹ Volver</button><div><b style="font-size:22px">${f[0]}</b> <small>${f[1]}</small></div><div class=qty><button data-a=qty data-d=-.5>−</button><b>${q}</b><button data-a=qty data-d=.5>+</button></div>${tiles(r0(f[2]*q),r1(f[3]*q),r1(f[4]*q),r1(f[5]*q))}<button class="btn alt" data-a=ok>Agregar</button>`}
 else{const T=[['s','🔎','Buscar'],['a','✨','IA'],['f','📷','Foto'],['m','✍️','Manual']];
  h=`<div class=seg>${T.map(([k,e,n])=>`<button class="${md.t==k?'on':''}" data-a=mt data-k=${k}><span>${e}</span>${n}</button>`).join('')}</div>`;
  if(md.t=='s')h+=`<input id=q placeholder="Buscar alimento…" value="${esc(md.q||'')}" autocomplete=off><div id=fl>${flist()}</div>`;
  else if(md.t=='m')h+=`<div class=man><input class=w id=mn placeholder="Nombre (ej. Pupusa)"><input id=mk type=number inputmode=numeric placeholder="kcal"><input id=mp type=number inputmode=decimal placeholder="Prot g"><input id=mc type=number inputmode=decimal placeholder="Carb g"><input id=mf type=number inputmode=decimal placeholder="Grasa g" class=w></div><button class="btn alt" data-a=man>Agregar</button>`;
  else if(!AI())h+=needAI();
  else if(md.busy)h+=busyView();
  else if(md.res)h+=resView();
  else if(md.t=='a')h+=`<input id=ai placeholder="Ej: dos tacos de pollo y un jugo" value="${esc(md.at||'')}">${md.err?`<p class=err>${md.err}</p>`:''}<button class="btn alt" data-a=ai>✨ Estimar con IA</button>`;
  else h+=`${md.err?`<p class=err>${md.err}</p>`:''}<button class=drop data-a=cam><span>📸</span>Tomar foto</button><button class="btn ghost" data-a=gal style="width:100%;margin:0">o elegir de la galería</button><input id=cam type=file accept="image/*" capture=environment hidden><input id=ph type=file accept="image/*" hidden>`}
 return `<div class=ov data-a=x><div class=sh>${head}${h}</div></div>`}
const tabbar=()=>`<nav class=tabs>${[['plan','🍽️','Plan'],['prog','📈','Progreso'],0,['lg','🏅','Logros'],['me','👤','Perfil']].map(t=>t?`<div class="${tab==t[0]?'on':''}" data-a=tab data-k=${t[0]}><span>${t[1]}</span>${t[2]}</div>`:`<div class=fw><button class=fab data-a=fab aria-label="Agregar comida">+</button></div>`).join('')}</nav>`;
function render(){
 if(sb&&!U&&!skip){N.innerHTML=loginView();return}
 if(!S.p||ob){if(!ob)ob={...DEF};N.innerHTML=obView();const cu=$('#cu');if(cu)countUp(cu);return}
 N.innerHTML=(tab=='plan'?home():tab=='prog'?prog():tab=='lg'?logros():perfil())+tabbar()+modal()}
const push=x=>{dayL(sel).items.push({m:md.m,...x});md=null;yumUntil=Date.now()+1800;setTimeout(()=>{if(!md&&!ob)render()},1850);save();render()};
async function estimate(payload,src){const m=md;m.busy=true;m.err=null;m.res=null;render();try{const ss=(await sb.auth.getSession()).data.session,r=await fetch(CF.WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ss.access_token},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw 0;m.res={n:j.name,s:src,k:r0(j.kcal),p:r1(j.protein),c:r1(j.carbs),f:r1(j.fat)}}catch(e){m.err='No pude estimarlo ahora. Intenta de nuevo en un momento.'}m.busy=false;if(md===m)render()}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||(el.classList.contains('ov')&&e.target!==el))return;const a=el.dataset.a,d=el.dataset;
 if(a=='o'){ob[d.k]=isNaN(d.v)?d.v:+d.v;render()}
 else if(a=='nm'||a=='np'){const s=$('input[type=range]'),k=s.dataset.k,st=+s.step,v=Math.min(+s.max,Math.max(+s.min,r1(ob[k]+(a=='np'?st:-st))));ob[k]=v;if(k=='h'||k=='w'||k=='rate')fit();render()}
 else if(a=='next'){if(oi<keys().length-1){oi++;render();scrollTo(0,0);if(keys()[oi]=='sum')confetti()}else{finish();oi=0;render();scrollTo(0,0)}}
 else if(a=='back'){oi--;render()}
 else if(a=='tab'){tab=d.k;rs=false;render();scrollTo(0,0)}
 else if(a=='day'){sel=d.d;render()}
 else if(a=='wk'){sel=dk(new Date(at(sel).getTime()+d.n*7*DAY));render()}
 else if(a=='add'){md={m:+d.i,q:'',pick:null,t:'s'};render()}
 else if(a=='fab'){tab='plan';md={m:defMeal(meals(S.p.meals).length),q:'',pick:null,t:'s'};render()}
 else if(a=='mm'){md.m=+d.i;render()}
 else if(a=='mt'){md.t=d.k;md.err=null;md.res=null;render()}
 else if(a=='pick'){md.pick=+d.i;md.qty=1;render()}
 else if(a=='bk'){md.pick=null;render()}
 else if(a=='qty'){md.qty=Math.max(.5,md.qty+ +d.d);render()}
 else if(a=='ok'){const f=FOODS[md.pick],q=md.qty;push({n:f[0],s:f[1],q,k:r0(f[2]*q),p:r1(f[3]*q),c:r1(f[4]*q),f:r1(f[5]*q)})}
 else if(a=='man'){const n=$('#mn').value.trim()||'Alimento',k=+$('#mk').value;if(k>0)push({n,s:'Manual',k:r0(k),p:r1(+$('#mp').value||0),c:r1(+$('#mc').value||0),f:r1(+$('#mf').value||0)})}
 else if(a=='x'){md=null;render()}
 else if(a=='del'){dayL(sel).items.splice(+d.i,1);save();render()}
 else if(a=='wdrop'){const L=dayL(sel),wg=r0(S.p.w*35/250)*250,i=+d.i,was=L.water;L.water=was==(i+1)*250?i*250:(i+1)*250;save();render();if(was<wg&&L.water>=wg)confetti()}
 else if(a=='wdn'){const L=dayL(sel);L.water=Math.max(0,L.water-250);save();render()}
 else if(a=='wsave'){const w=+$('#wi').value;if(w>20&&w<400){const l=S.wt[S.wt.length-1];if(l&&l.d==today)l.w=w;else S.wt.push({d:today,w});S.p.w=w;S.t=calc(S.p);save();render()}}
 else if(a=='mail'){const em=$('#em').value.trim();if(em){const{error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.href.split('#')[0]}});$('#lm').textContent=error?'No se pudo enviar: '+error.message:'¡Listo! Abre el enlace que te llegó al correo.'}}
 else if(a=='google'){sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}})}
 else if(a=='skip'){skip=true;render()}
 else if(a=='login'){skip=false;md=null;render()}
 else if(a=='out'){await sb.auth.signOut();S={p:null,t:null,log:{},wt:[]};loc();ob=null;oi=0}
 else if(a=='ai'){const t=$('#ai').value.trim();if(!t)return;md.at=t;estimate({text:t},'Estimado con IA')}
 else if(a=='rok'){const r=md.res;push({n:($('#rn').value.trim()||r.n),s:r.s,k:r.k,p:r.p,c:r.c,f:r.f})}
 else if(a=='rno'){md.res=null;render()}
 else if(a=='cam'){$('#cam').value='';$('#cam').click()}
 else if(a=='gal'){$('#ph').value='';$('#ph').click()}
 else if(a=='theme'){TH=d.v;try{localStorage.setItem('munchi-theme',TH)}catch(e){}applyTh();render()}
 else if(a=='redo'){ob={...S.p};oi=0;render();scrollTo(0,0)}
 else if(a=='reset'){if(rs){if(sb&&U)for(const t of ['food_logs','water_logs','weight_logs','profiles'])await sb.from(t).delete().eq('user_id',U.id);try{localStorage.removeItem(K)}catch(e){}S={p:null,t:null,log:{},wt:[]};rs=false;ob=null;oi=0}else rs=true;render()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.type=='range'&&t.dataset.k){const k=t.dataset.k;ob[k]=+t.value;if(k=='h'||k=='w'||k=='rate'){fit()}$('#v').textContent=ob[k];$('#nt').textContent=nt(k)}
 else if(t.id=='q'){md.q=t.value;$('#fl').innerHTML=flist()}
 else if(t.id=='ai'){md.at=t.value}});
document.addEventListener('change',async e=>{if((e.target.id!='ph'&&e.target.id!='cam')||!e.target.files[0]||!md)return;try{const im=await createImageBitmap(e.target.files[0]),k=Math.min(1,1024/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);estimate({image:cv.toDataURL('image/jpeg',.8).split(',')[1],mime:'image/jpeg'},'Estimado con IA (foto)')}catch(err){md.err='No pude leer esa foto. Prueba con otra.';render()}});
boot();
</script></body></html>
